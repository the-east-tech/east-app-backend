server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: east-app

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health


eastapp:
  database:
    reset-on-start: ${EASTAPP_DATABASE_RESET_ON_START:false}


  attendance:
    time-zone: ${EASTAPP_ATTENDANCE_TIME_ZONE:Asia/Kuala_Lumpur}

  google-places:
    region-code: MY
    language-code: en
    rating-cache-minutes: 15
