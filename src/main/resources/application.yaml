server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 205MB
  application:
    name: east-app

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only

  jpa:
    hibernate:
      # The disposable development baseline is checked only when it is recreated.
      # A preserved older schema must not block application startup.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 32
        jdbc.batch_size: 32
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health


eastapp:
  database:
    # Environment gate. A wipe also requires DATABASE_RESET_ALLOWED_BY_CODE=true.
    reset-on-start: ${EASTAPP_DATABASE_RESET_ON_START:false}

  attendance:
    time-zone: ${EASTAPP_ATTENDANCE_TIME_ZONE:Asia/Kuala_Lumpur}

  google-places:
    region-code: MY
    language-code: en
    rating-cache-minutes: 60

  reports:
    time-zone: ${EASTAPP_REPORT_TIME_ZONE:Asia/Kuala_Lumpur}
    daily-photo-minimum: 5

  notifications:
    # In-app notifications work without Firebase. Enable native push only after
    # the Firebase project and service credentials are configured in Railway.
    push-enabled: ${EASTAPP_NOTIFICATION_PUSH_ENABLED:false}
    firebase-project-id: ${EASTAPP_FIREBASE_PROJECT_ID:}
    firebase-service-account-json: ${EASTAPP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    dispatch-delay-ms: ${EASTAPP_NOTIFICATION_DISPATCH_DELAY_MS:5000}

  translation:
    provider-enabled: ${EASTAPP_TRANSLATION_PROVIDER_ENABLED:false}
    cloudflare-account-id: ${EASTAPP_CLOUDFLARE_ACCOUNT_ID:}
    cloudflare-api-token: ${EASTAPP_CLOUDFLARE_API_TOKEN:}
    model: "@cf/meta/m2m100-1.2b"
    maximum-parallel-requests: 6
