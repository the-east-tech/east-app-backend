server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 205MB
  application:
    name: flow-backend

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only

  jpa:
    hibernate:
      # The disposable development baseline is checked only when it is recreated.
      # A preserved older schema must not block application startup.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 32
        jdbc.batch_size: 32
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health


flow:
  app-version:
    android:
      latest-version: ${FLOW_APP_VERSION_ANDROID_LATEST_VERSION:1.0.0}
      latest-build-number: ${FLOW_APP_VERSION_ANDROID_LATEST_BUILD_NUMBER:7}
      update-url: ${FLOW_APP_VERSION_ANDROID_UPDATE_URL:https://play.google.com/store/apps/details?id=com.sequosal.flow}
    ios:
      latest-version: ${FLOW_APP_VERSION_IOS_LATEST_VERSION:1.0.0}
      latest-build-number: ${FLOW_APP_VERSION_IOS_LATEST_BUILD_NUMBER:7}
      update-url: ${FLOW_APP_VERSION_IOS_UPDATE_URL:}

  error-report:
    enabled: ${FLOW_ERROR_REPORT_ENABLED:false}
    api-key: ${FLOW_RESEND_API_KEY:}
    api-url: ${FLOW_RESEND_API_URL:https://api.resend.com/emails}
    recipient: ${FLOW_ERROR_REPORT_RECIPIENT:}
    from: ${FLOW_ERROR_REPORT_FROM:Flow <onboarding@resend.dev>}
    duplicate-window-seconds: ${FLOW_ERROR_REPORT_DUPLICATE_WINDOW_SECONDS:300}

  database:
    # Environment gate. A wipe also requires DATABASE_RESET_ALLOWED_BY_CODE=true.
    reset-on-start: ${FLOW_DATABASE_RESET_ON_START:false}

  attendance:
    time-zone: ${FLOW_ATTENDANCE_TIME_ZONE:Asia/Kuala_Lumpur}

  google-places:
    region-code: MY
    language-code: en
    rating-cache-minutes: 60

  reports:
    time-zone: ${FLOW_REPORT_TIME_ZONE:Asia/Kuala_Lumpur}
    daily-photo-minimum: 5

  notifications:
    # In-app notifications work without Firebase. Enable native push only after
    # the Firebase project and service credentials are configured in Railway.
    push-enabled: ${FLOW_NOTIFICATION_PUSH_ENABLED:false}
    firebase-project-id: ${FLOW_FIREBASE_PROJECT_ID:}
    firebase-service-account-json: ${FLOW_FIREBASE_SERVICE_ACCOUNT_JSON:}
    dispatch-delay-ms: ${FLOW_NOTIFICATION_DISPATCH_DELAY_MS:5000}

  translation:
    provider-enabled: ${FLOW_TRANSLATION_PROVIDER_ENABLED:false}
    cloudflare-account-id: ${FLOW_CLOUDFLARE_ACCOUNT_ID:}
    cloudflare-api-token: ${FLOW_CLOUDFLARE_API_TOKEN:}
    model: "@cf/meta/m2m100-1.2b"
    maximum-parallel-requests: 6
